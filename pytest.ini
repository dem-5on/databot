[pytest]
asyncio_mode = auto
testpaths = tests
# addopts configures the terminal runner for robustness and better reporting
addopts = -v --tb=short --strict-markers --durations=10

markers =
    unit: Pure unit tests, minimal or no IO
    integration: Tests that interact with the mocked persistence layers and external APIs
    api: Tests that exercise the HTTP endpoints and check routing/contracts
    security: Adversarial tests checking auth, input limits, and edge cases
    slow: Tests that take a long time to run
