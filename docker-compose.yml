version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Supabase REST API credentials (required)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - .:/app
    command: ./app/entrypoint.sh

# Note: PostgreSQL service removed - using Supabase managed database
# Database migrations are handled via Supabase Dashboard SQL Editor
# See SUPABASE_MIGRATION_GUIDE.md for details

