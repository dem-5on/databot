version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: databot_postgres
    environment:
      POSTGRES_USER: databot_user
      POSTGRES_PASSWORD: rxZ94kofi
      POSTGRES_DB: me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databot_user -d databot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use service name when running in Docker
      - DATABASE_URL=postgresql+asyncpg://databot_user:rxZ94kofi@postgres:5432/databot_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ./app/entrypoint.sh

volumes:
  postgres_data:

