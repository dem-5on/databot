version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: databot_postgres
    environment:
      POSTGRES_USER: databot_user
      POSTGRES_PASSWORD: databot_password
      POSTGRES_DB: databot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databot_user -d databot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ./app/entrypoint.sh

volumes:
  postgres_data:

